<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citi Bike Dashboard</title>
    <!-- Thư viện D3.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <!-- CSS chung -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER & KPI -->
    <header>
        <h1>Citi Bike Dashboard (Jersey City 2025)</h1>
        <div class="kpi-container">
            <div class="kpi-card">
                <h3>Total Trips</h3>
                <p id="kpi-total-trips">Loading...</p>
            </div>
            <div class="kpi-card">
                <h3>Avg Duration</h3>
                <p id="kpi-avg-duration">Loading...</p>
            </div>
            <div class="kpi-card">
                <h3>Member Share</h3>
                <p id="kpi-member-share">Loading...</p>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT: CHIA 3 KHU VỰC -->
    <main>
        <!-- KHU VỰC CỦA TV2 -->
        <section class="module" id="module-user">
            <h2>User Type Analysis</h2>
            <div id="tv2-bar-chart" class="chart-placeholder">[TV2: Bar Chart]</div>
            <div id="tv2-box-plot" class="chart-placeholder">[TV2: Box Plot]</div>
        </section>

        <!-- KHU VỰC CỦA TV3 (BẠN) -->
        <section class="module" id="module-temporal">
            <h2>Temporal Analysis</h2>
            <div id="tv3-line-chart"></div>
            <div id="tv3-bar-chart"></div>
        </section>

        <!-- KHU VỰC CỦA TV4 -->
        <section class="module" id="module-route">
            <h2>Station & Route Analysis</h2>
            <div id="tv4-map" class="chart-placeholder">[TV4: Leaflet Map]</div>
            <div id="tv4-route-chart" class="chart-placeholder">[TV4: Top Routes]</div>
        </section>
    </main>

    <!-- TOOLTIP DÙNG CHUNG -->
    <div id="tooltip" class="tooltip"></div>

    <!-- NHÚNG CÁC FILE JS -->
    <script src="main.js"></script>
    <script src="charts/user_charts.js"></script>
    <script src="charts/temporal_charts.js"></script>
    <script src="charts/route_charts.js"></script>
</body>
</html>
