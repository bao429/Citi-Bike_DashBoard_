<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citi Bike Usage Over Time</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 class="main-title">Citi Bike Usage Over Time</h1>

    <!-- THANH BỘ LỌC -->
    <div class="filter-bar">
        <div class="filter-group">
            <label>Month:</label>
            <!-- Mặc định chọn sẵn 4 tháng -->
            <button class="filter-btn month-btn active" data-month="2025-01">Jan</button>
            <button class="filter-btn month-btn active" data-month="2025-04">Apr</button>
            <button class="filter-btn month-btn active" data-month="2025-07">Jul</button>
            <button class="filter-btn month-btn active" data-month="2025-10">Oct</button>
        </div>
        <div class="filter-group">
            <label>Bike Type:</label>
            <button class="filter-btn active">All</button>
        </div>
    </div>

    <!-- THẺ KPI -->
    <div class="kpi-row">
        <div class="kpi-card">
            <span class="kpi-title">Total Trips</span>
            <span class="kpi-value" id="kpi-total-trips">--</span>
        </div>
        <div class="kpi-card">
            <span class="kpi-title">Average Trip Duration</span>
            <span class="kpi-value" id="kpi-avg-duration">--</span>
        </div>
        <div class="kpi-card">
            <span class="kpi-title">Peak Hour</span>
            <span class="kpi-value" id="kpi-peak-hour">--</span>
        </div>
        <div class="kpi-card">
            <span class="kpi-title">Busiest Day</span>
            <span class="kpi-value" id="kpi-busiest-day">--</span>
        </div>
    </div>

    <!-- BIỂU ĐỒ -->
    <div class="charts-layout">
        <div class="chart-container full-width">
            <h3>Number of trips per day</h3>
            <div id="chart-daily"></div>
        </div>

        <div class="chart-container half-width">
            <h3>Trips by hour of day</h3>
            <div id="chart-hourly"></div>
        </div>

        <div class="chart-container half-width">
            <h3>Trips by month</h3>
            <div id="chart-monthly"></div>
        </div>
    </div>

    <!-- TOOLTIP -->
    <div id="tooltip" class="tooltip"></div>

    <!--
        main.js hiện CHƯA được include ở đây.
        Lý do: main.js đang dùng id "kpi-member-share" (không tồn tại trong layout
        này), trong khi temporal_charts.js đã tự tính đủ 4 KPI (Total Trips, Avg
        Duration, Peak Hour, Busiest Day) theo đúng bộ lọc tháng đang chọn. Nạp cả
        2 file cùng lúc sẽ gây trùng/lệch logic KPI. Giữ main.js lại làm tham khảo
        cho Thành viên 1 khi bạn ấy làm index.html/main.js chính thức cho cả nhóm.
    -->
    <script src="charts/temporal_charts.js"></script>
</body>
</html>
